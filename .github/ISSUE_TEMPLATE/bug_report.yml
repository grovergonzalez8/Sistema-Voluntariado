name: Reporte de error
description: Comportamiento incorrecto reproducible sin datos sensibles
title: 'fix: '
labels: ['bug']
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportamiento observado
      description: No incluya secretos, tokens ni datos personales.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducción mínima
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit o versión
    validations:
      required: true
