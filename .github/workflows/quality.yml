name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Activate pnpm with Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application
        run: pnpm verify

      - name: Test Edge Function handler
        run: pnpm test:functions

      - name: Start and reset local Supabase
        run: |
          pnpm db:start
          pnpm db:reset

      - name: Lint and test database
        run: |
          pnpm exec supabase db lint --local --level warning
          pnpm db:test

      - name: Test project assignment concurrency
        timeout-minutes: 2
        run: pnpm projects:test:concurrency

      - name: Install Chromium
        run: pnpm --filter @sistema-voluntariado/web exec playwright install --with-deps chromium

      - name: Run end-to-end tests against local Supabase
        shell: bash
        run: |
          set -euo pipefail
          cp supabase/functions/.env.example supabase/functions/.env.local
          status="$(pnpm exec supabase status -o env)"
          export VITE_SUPABASE_URL="$(sed -n 's/^API_URL="\(.*\)"$/\1/p' <<< "$status")"
          export VITE_SUPABASE_ANON_KEY="$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' <<< "$status")"
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          # pnpm test:e2e owns exactly one Edge Function process, verifies
          # its typed readiness response, and tears it down before returning.
          pnpm test:e2e

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop
